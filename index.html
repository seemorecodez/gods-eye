<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Content Security Policy: allow same-origin scripts, external styles/fonts,
         and the specific third-party origins this application legitimately loads. -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: blob:
        https://cdnjs.cloudflare.com
        https://*.tile.openstreetmap.org
        https://*.arcgisonline.com
        https://server.arcgisonline.com
        https://i.ytimg.com
        https://images.skylinewebcams.com
        https://www.abbeyroad.com;
      connect-src 'self'
        https://api.github.com
        https://opensky-network.org
        https://api.wheretheiss.at
        http://api.open-notify.org
        https://api.open-meteo.com
        https://earthquake.usgs.gov
        https://firms.modaps.eosdis.nasa.gov
        https://data.blitzortung.org
        https://disease.sh
        https://api.acleddata.com
        https://scihub.copernicus.eu
        https://earthengine.googleapis.com;
      frame-src
        https://www.youtube.com
        https://video.nest.com
        https://hd-auth.skylinewebcams.com
        https://www.earthcam.com;
      worker-src 'self' blob:;
      object-src 'none';
    " />
    <title>God's Eye - Real-Time OSINT Map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="/src/main.css" rel="stylesheet" />
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
